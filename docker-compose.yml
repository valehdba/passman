services:
  postgres:
    image: postgres:16-alpine
    container_name: passman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-passman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passman}
      POSTGRES_DB: ${POSTGRES_DB:-passman}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - passman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: passman-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: ${PASSMAN_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Default targets the bundled Postgres. Override API_DATABASE_URL to use an
      # external server (then start with: docker compose up -d --no-deps api web).
      # URL-encode special characters in the password (e.g. @ -> %40).
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-passman}:${POSTGRES_PASSWORD:-passman}@postgres:5432/${POSTGRES_DB:-passman}}
      # Required, never hard-coded: openssl rand -hex 64
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:${WEB_PORT:-8080}"]}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      LOGIN_ATTEMPTS_PER_15MIN: ${LOGIN_ATTEMPTS_PER_15MIN:-10}
      SERVER_ARGON2_TIME_COST: ${SERVER_ARGON2_TIME_COST:-2}
      SERVER_ARGON2_MEMORY_COST: ${SERVER_ARGON2_MEMORY_COST:-19456}
      SERVER_ARGON2_PARALLELISM: ${SERVER_ARGON2_PARALLELISM:-1}
      # In-browser SSH terminal: JSON list of allowed targets. Empty = disabled.
      SSH_ALLOWED_HOSTS: ${SSH_ALLOWED_HOSTS:-[]}
      TRUSTED_DEVICE_DEFAULT_DAYS: ${TRUSTED_DEVICE_DEFAULT_DAYS:-30}
      TRUSTED_DEVICE_MAX_DAYS: ${TRUSTED_DEVICE_MAX_DAYS:-90}
      TRUSTED_DEVICE_MAX_PER_USER: ${TRUSTED_DEVICE_MAX_PER_USER:-10}
      # Only this account can change the server database from Settings. Empty = disabled.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - passman_data:/data
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: passman-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  passman_pgdata:
  passman_data:
