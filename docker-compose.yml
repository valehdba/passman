services:
  postgres:
    image: postgres:16-alpine
    container_name: passman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: passman
      POSTGRES_PASSWORD: passman
      POSTGRES_DB: passman
    ports:
      - "5432:5432"
    volumes:
      - passman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passman"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  passman_pgdata:
