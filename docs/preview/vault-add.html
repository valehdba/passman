<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passman — Vault (add credential)</title>
    <link rel="stylesheet" href="../../packages/web/src/styles.css" />
  </head>
  <body>
    <main class="vault-container">
      <header>
        <h1>Vault</h1>
        <button>Lock & sign out</button>
      </header>

      <div class="vault-toolbar">
        <input type="search" class="vault-search" placeholder="Search hostname, IP, user, name…" aria-label="Search credentials" />
        <label class="vault-group-label">
          Group by
          <select>
            <option>No grouping</option>
            <option>Hostname</option>
            <option>IP address</option>
            <option>User</option>
            <option>Port</option>
          </select>
        </label>
      </div>

      <section class="vault-group">
        <div class="vault-grid" role="table">
          <div class="vault-grid-row vault-grid-head" role="row">
            <span role="columnheader">Name</span>
            <span role="columnheader">Hostname</span>
            <span role="columnheader">IP address</span>
            <span role="columnheader">User</span>
            <span role="columnheader">Password</span>
            <span role="columnheader">Port</span>
            <span role="columnheader" aria-label="Actions"></span>
          </div>
          <div class="vault-grid-row" role="row">
            <span role="cell" data-col="Name"><strong>prod-pg-primary</strong></span>
            <span role="cell" data-col="Hostname">db-prod-01</span>
            <span role="cell" data-col="IP">10.0.0.42</span>
            <span role="cell" data-col="User">postgres</span>
            <span role="cell" data-col="Password" class="vault-pw-cell">
              <code>••••••••</code>
              <button type="button" class="vault-icon-btn">Show</button>
              <button type="button" class="vault-icon-btn">Copy</button>
            </span>
            <span role="cell" data-col="Port">5432</span>
            <span role="cell" class="vault-actions">
              <button type="button" class="vault-icon-btn vault-danger">Delete</button>
            </span>
          </div>
        </div>
      </section>

      <form class="vault-add-form">
        <h2>New credential</h2>
        <label>
          Name
          <input value="staging-pg" />
        </label>
        <div class="vault-form-row">
          <label>
            Hostname
            <input value="db-staging-01" placeholder="db-prod-01" />
          </label>
          <label>
            IP address
            <input value="10.0.5.12" placeholder="10.0.0.42" />
          </label>
          <label>
            Port
            <input type="number" value="5432" placeholder="5432" />
          </label>
        </div>
        <label>
          User
          <input value="postgres" />
        </label>
        <label>
          Password
          <input type="password" value="............" />
        </label>
        <label>
          URL
          <input value="postgres://db-staging-01:5432/app" />
        </label>
        <div class="vault-form-actions">
          <button type="submit">Save</button>
          <button type="button">Cancel</button>
        </div>
      </form>
    </main>
  </body>
</html>
