<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passman — Add credential</title>
    <link rel="stylesheet" href="../../packages/web/src/styles.css" />
  </head>
  <body>
    <div class="vault-app">
      <aside class="vault-side">
        <div class="brand"><div class="brand-mark"></div> Passman</div>
        <div class="side-search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input placeholder="Filter views…" />
        </div>
        <div>
          <div class="side-section">Vault</div>
          <div class="side-list">
            <button class="side-item active"><span class="left">All credentials</span><span class="count">6</span></button>
          </div>
        </div>
        <div class="user-card">
          <div class="avatar">VA</div>
          <div class="who">
            <div class="email">ops@example.az</div>
            <small>
              <a href="#" class="user-card-action">Settings</a>
              ·
              <button type="button" class="user-card-action">Export</button>
            </small>
          </div>
        </div>
      </aside>

      <main class="vault-main">
        <div class="vault-headrow">
          <div>
            <h1>All credentials</h1>
            <p class="sub"><span>6 entries</span><span class="dot"></span><span>Decrypted in your browser</span></p>
          </div>
          <div class="vault-headrow-actions">
            <button class="btn btn-ghost">↥ Import</button>
            <button class="btn btn-primary">+ New credential</button>
          </div>
        </div>

        <form class="add-form">
          <h2>New credential</h2>

          <div class="add-form-grid">
            <label>
              Name
              <input value="prod-pg-bastion" placeholder="prod-pg-primary" />
            </label>
            <label>
              Protocol
              <select>
                <option>— auto-detect from port —</option>
                <option>PostgreSQL</option>
                <option>MySQL</option>
                <option>Oracle</option>
                <option selected>SSH</option>
                <option>RDP (Windows Remote Desktop)</option>
              </select>
            </label>
            <label>
              Environment
              <input value="prod" placeholder="prod / staging / dev" />
            </label>
          </div>

          <div class="add-form-grid">
            <label>
              Hostname
              <input value="db-prod-02" placeholder="db-prod-01" />
            </label>
            <label>
              IP address
              <input value="10.0.0.43" placeholder="10.0.0.42" />
            </label>
            <label>
              Port
              <input type="number" value="22" placeholder="5432" />
            </label>
          </div>

          <div class="add-form-grid">
            <label>
              User
              <input value="postgres" placeholder="postgres" />
            </label>
            <label class="pw-field">
              <span class="pw-field-label-row">
                Password
                <button type="button" class="pw-field-gen-toggle">Hide generator</button>
              </span>
              <input type="password" value="............................" />
            </label>
          </div>

          <div class="pw-gen">
            <div class="pw-gen-output">
              <code class="pw-gen-value">vY2!gK7hQ9xP-mZ4wE6tR8nC</code>
              <button type="button" class="icon-btn" title="Regenerate">↻</button>
            </div>
            <div class="pw-gen-meter" data-strength="excellent">
              <div class="pw-gen-meter-bar">
                <div class="pw-gen-meter-fill" style="width: 100%"></div>
              </div>
              <span class="pw-gen-meter-label">144 bits · excellent</span>
            </div>
            <div class="pw-gen-row">
              <label class="pw-gen-length">
                Length: <strong>24</strong>
                <input type="range" min="6" max="64" value="24" />
              </label>
            </div>
            <div class="pw-gen-row pw-gen-checks">
              <label><input type="checkbox" checked /> a–z</label>
              <label><input type="checkbox" checked /> A–Z</label>
              <label><input type="checkbox" checked /> 0–9</label>
              <label><input type="checkbox" checked /> !@#$%</label>
              <label><input type="checkbox" /> No 0/O/1/l</label>
            </div>
            <div class="pw-gen-actions">
              <button type="button" class="btn btn-primary">Use this password</button>
              <button type="button" class="btn btn-ghost">Cancel</button>
            </div>
          </div>

          <div class="add-form-grid full-row">
            <label>
              URL
              <input value="ssh://postgres@db-prod-02:22" placeholder="https://… or postgres://…" />
            </label>
          </div>

          <div class="add-form-grid full-row">
            <label>
              SSH private key (PEM)
              <textarea class="ssh-key-input" rows="6" spellcheck="false">-----BEGIN OPENSSH PRIVATE KEY-----
b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
QyNTUxOQAAACBOgPYwIcMqkB+vHrrJBxdLs23p0qNkZmLCaUKmzVXBgwAAAJgkZX/gJGV/
4AAAAAtzc2gtZWQyNTUxOQAAACBOgPYwIcMqkB+vHrrJBxdLs23p0qNkZmLCaUKmzVXBgw
…
-----END OPENSSH PRIVATE KEY-----</textarea>
              <span class="ssh-key-hint">
                Optional. Encrypted with the same vault key as the password —
                the server never sees plaintext. Used by the Connect dialog to
                offer a "Download .pem" path with an `ssh -i` command.
              </span>
            </label>
          </div>

          <label class="storage-toggle on">
            <input type="checkbox" checked />
            <span class="storage-toggle-body">
              <span class="storage-toggle-title">Store on this device only</span>
              <span class="storage-toggle-hint">
                Encrypted ciphertext stays in this browser's IndexedDB · never sent to the server.<br />
                <strong>No cross-device sync</strong> · cleared if you clear site data ·
                single point of failure if this disk dies. Use for credentials you never
                want stored remotely, even encrypted.
              </span>
            </span>
          </label>

          <div class="add-form-actions">
            <button type="submit">Save</button>
            <button type="button">Cancel</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
