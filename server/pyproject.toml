[project]
name = "passman-server"
version = "0.1.0"
description = "Passman zero-knowledge password manager — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "email-validator==2.2.0",
    "python-multipart==0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "aiosqlite==0.20.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-python-jose==3.3.4.20240106",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers --cov=src/passman --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # allow hardcoded test secrets

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
