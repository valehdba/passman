name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one CI run per ref at a time; cancel in-progress on new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python backend: lint, typecheck, unit tests, integration tests vs Postgres
  # ---------------------------------------------------------------------------
  server:
    name: server (python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passman
          POSTGRES_PASSWORD: passman
          POSTGRES_DB: passman
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/pyproject.toml

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: server
        run: ruff check src tests

      - name: Format check (ruff format)
        working-directory: server
        run: ruff format --check src tests

      - name: Unit tests (sqlite, in-memory)
        working-directory: server
        env:
          JWT_SECRET: ci-jwt-secret-must-be-at-least-thirty-two-bytes-long-1234567890
          ENV: test
        run: pytest tests/ -v

      - name: Apply migrations to Postgres
        working-directory: server
        env:
          DATABASE_URL: postgresql+asyncpg://passman:passman@localhost:5432/passman
          JWT_SECRET: ci-jwt-secret-must-be-at-least-thirty-two-bytes-long-1234567890
          ENV: test
        run: alembic upgrade head

      - name: Smoke test against live Postgres
        working-directory: server
        env:
          DATABASE_URL: postgresql+asyncpg://passman:passman@localhost:5432/passman
          JWT_SECRET: ci-jwt-secret-must-be-at-least-thirty-two-bytes-long-1234567890
          ENV: test
        run: |
          uvicorn passman.main:app --port 8000 &
          PID=$!
          for i in {1..30}; do
            if curl -sf http://localhost:8000/healthz > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://localhost:8000/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          kill $PID

  # ---------------------------------------------------------------------------
  # TypeScript packages: install once, lint+typecheck+test+build all workspaces
  # ---------------------------------------------------------------------------
  ts:
    name: typescript packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Build (core first, then dependents)
        run: |
          npm run build --workspace=@passman/core
          npm run build --workspace=@passman/web
          npm run build --workspace=@passman/extension --if-present

      - name: Test (all workspaces)
        run: npm run test --workspaces --if-present

  # ---------------------------------------------------------------------------
  # End-to-end: TS client talks to a real running Python server
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (ts client → python server)
    runs-on: ubuntu-latest
    needs: [server, ts]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: passman
          POSTGRES_PASSWORD: passman
          POSTGRES_DB: passman
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install backend
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend deps
        run: npm ci

      - name: Build core
        run: npm run build --workspace=@passman/core

      - name: Migrate
        working-directory: server
        env:
          DATABASE_URL: postgresql+asyncpg://passman:passman@localhost:5432/passman
          JWT_SECRET: ci-jwt-secret-must-be-at-least-thirty-two-bytes-long-1234567890
        run: alembic upgrade head

      - name: Start server
        working-directory: server
        env:
          DATABASE_URL: postgresql+asyncpg://passman:passman@localhost:5432/passman
          JWT_SECRET: ci-jwt-secret-must-be-at-least-thirty-two-bytes-long-1234567890
          ENV: test
        run: |
          nohup uvicorn passman.main:app --port 8000 > server.log 2>&1 &
          for i in {1..40}; do
            if curl -sf http://localhost:8000/healthz > /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      - name: Run integration tests
        env:
          PASSMAN_INTEGRATION_URL: http://localhost:8000
        run: npm run test --workspace=@passman/core
