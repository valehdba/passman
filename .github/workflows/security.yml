name: Security audit

# Security audits run on every push, every PR, and on a weekly schedule so
# advisories published after merge still surface.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Hard gate on advisories in code that ships to users (runtime deps).
  # Soft (informational) audit on dev tooling — vulns there matter for
  # contributor safety but shouldn't block unrelated PRs.
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/pyproject.toml

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Install runtime deps only
        working-directory: server
        # Non-editable install so the resolved dep set ends up in `pip freeze`
        # without the `-e` marker that would force pip-audit to query PyPI for
        # the project itself.
        run: pip install .

      - name: Build runtime requirements file (excludes the project itself)
        working-directory: server
        # pip-audit's environment-mode emits warnings for any editable or
        # non-PyPI distribution; under --strict those warnings become fatal.
        # Auditing a requirements file we generate sidesteps the issue
        # entirely: passman-server is filtered out, every other package
        # gets audited.
        run: |
          pip freeze --exclude-editable \
            | grep -v '^passman-server' \
            > /tmp/runtime-reqs.txt
          wc -l /tmp/runtime-reqs.txt

      - name: Audit runtime deps (gate)
        # `--strict` makes unparseable advisories hard fails. The
        # `--ignore-vuln` entries below are tracked exceptions:
        #
        #   CVE-2025-54121, CVE-2025-62727 — starlette, transitive via
        #     fastapi==0.115.5. Cleared by starlette 0.47.2+ / 0.49.1+
        #     respectively, which require a fastapi major bump. Tracked
        #     for Phase 2 (fastapi upgrade).
        #
        #   CVE-2026-30922 — pyasn1 0.4.8, transitive via python-jose 3.4.0
        #     which hard-pins pyasn1<0.5. Cleared by pyasn1 0.6.3, which
        #     requires migrating off python-jose (Phase 2).
        #
        # Each exception MUST have a tracking issue and a removal target.
        run: |
          pip-audit --strict -r /tmp/runtime-reqs.txt \
            --ignore-vuln CVE-2025-54121 \
            --ignore-vuln CVE-2025-62727 \
            --ignore-vuln CVE-2026-30922

      - name: Install dev deps
        working-directory: server
        run: pip install -e ".[dev]"

      - name: Audit full tree (informational)
        working-directory: server
        run: pip-audit --skip-editable
        continue-on-error: true

  npm-audit:
    name: npm audit (TS deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Audit production deps (gate)
        # Hard gate on shipped code: high/critical CVE in any non-dev dep
        # blocks the PR. dev tooling (vitest, vite, etc.) is audited in
        # the next step without blocking.
        run: npm audit --audit-level=high --omit=dev

      - name: Audit full tree (informational)
        run: npm audit
        continue-on-error: true
